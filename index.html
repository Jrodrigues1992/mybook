<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyBook</title>
<script src="lib/jszip.min.js"></script>
<script src="lib/epub.min.js"></script>
<script src="lib/pdf.min.js"></script>
<style>
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#17211d; --muted:#5b6962; --line:#d3d9d3;
  --accent:#1f5f4c; --on-accent:#ffffff; --shelf:#c4ccc4; --chip:#e0e5df; --danger:#b3261e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1210; --surface:#171d1a; --ink:#e6ece8; --muted:#97a59d; --line:#27312c;
    --accent:#62d0aa; --on-accent:#05241a; --shelf:#222b26; --chip:#1e2723; --danger:#ff8f86; color-scheme:dark;}
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body.reading{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn:active{background:rgba(127,127,127,.18)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- biblioteca ---------- */
#lib{max-width:900px;margin:0 auto;padding:0 14px 96px}
.lhead{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px}
.lhead h1{flex:1;margin:0;font:600 32px/1.1 var(--serif);letter-spacing:-.01em}
.lsearch input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid transparent;background:var(--chip);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip .n{opacity:.6;font-weight:500;margin-left:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.resume{display:flex;gap:14px;align-items:center;margin:14px 0 4px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.resume .mini{width:58px;flex:none}
.resume .info{flex:1;min-width:0}
.resume .info b{display:block;font:600 17px/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.resume .info span{font-size:13px;color:var(--muted)}
.ltool{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;font-size:14px;color:var(--muted)}
.ltool select{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));column-gap:0;row-gap:22px;margin-top:10px}
.card{position:relative;padding:0 8px}
.cw{position:relative;display:block;width:100%;aspect-ratio:2/3;padding:0;border:0;background:var(--chip);border-radius:3px 6px 6px 3px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.2),0 8px 12px -6px rgba(0,0,0,.45)}
.cw::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-9px;height:8px;background:var(--shelf);z-index:-1}
.cw img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.gen{width:100%;height:100%;border-radius:inherit;padding:14px 10px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#f3efe6;overflow:hidden;position:relative}
.gen::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.22)}
.gen b{font:600 15px/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.gen span{font-size:11px;opacity:.8;line-height:1.2}
.cw .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);border-radius:0 0 6px 3px;overflow:hidden}
.cw .bar i{display:block;height:100%;background:#62d0aa}
.tag{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;letter-spacing:.02em}
.tag.star{left:auto;right:6px;background:rgba(0,0,0,.6);color:#ffd54a;font-size:13px;padding:0 6px}
.tag.ok{top:auto;left:6px;bottom:10px;background:#1f5f4c}
.meta{padding-top:12px;padding-right:28px}
.ct{font:600 14px/1.25 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{position:absolute;right:6px;bottom:-4px;width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center}
.empty{margin:12vh auto 0;max-width:340px;text-align:center;color:var(--muted)}
.empty h2{font:600 24px/1.2 var(--serif);color:var(--ink);margin:0 0 8px}
.empty .btn{margin-top:14px;min-width:200px}

/* ---------- janelas ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,10,8,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.tall{height:min(84vh,680px);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:620px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 6px;font:600 22px/1.2 var(--serif)}
.sheet h3{margin:18px 0 8px;font-size:15px}
.sheet p{margin:0 0 10px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.menu .btn{text-align:left}
.bhead{display:flex;gap:14px;align-items:center}
.bhead .mini{width:64px;flex:none}
.bhead h2{font-size:19px}
.bhead .sm{display:flex;gap:12px;font-size:13px;margin:4px 0 0}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.shelfrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.shelfrow b{flex:1;font-weight:600}
.shelfrow small{color:var(--muted)}

/* ---------- leitor ---------- */
#reader{--rbg:#fbfbf8;--rfg:#1c1c1a;--rbar:rgba(251,251,248,.94);--rline:#e0e0da;--rmuted:#6b6b64;--racc:#1f5f4c;
  position:fixed;inset:0;z-index:20;background:var(--rbg);color:var(--rfg)}
#reader[data-theme="sepia"]{--rbg:#f1e7d0;--rfg:#3b2f1e;--rbar:rgba(241,231,208,.95);--rline:#dccfae;--rmuted:#7d6b4f;--racc:#7a4a12}
#reader[data-theme="escuro"]{--rbg:#121614;--rfg:#d3dad6;--rbar:rgba(18,22,20,.95);--rline:#2a332f;--rmuted:#8b9a92;--racc:#62d0aa}
#area{position:absolute;inset:0}
#epubArea{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:16px;right:16px}
#pdfArea{position:absolute;inset:0;overflow:auto;text-align:center;background:var(--rbg);-webkit-overflow-scrolling:touch}
#pdfCanvas{display:inline-block;vertical-align:top;background:#fff}
#reader[data-theme="escuro"] #pdfCanvas{filter:invert(1) hue-rotate(180deg)}
#reader[data-theme="sepia"] #pdfCanvas{filter:sepia(.4) saturate(.9) brightness(.97)}
.rloading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--rmuted);z-index:2}
.rbar{position:absolute;left:0;right:0;z-index:3;background:var(--rbar);color:var(--rfg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .2s,visibility 0s}
.rbar.top{top:0;display:flex;align-items:center;gap:2px;padding:env(safe-area-inset-top,0px) 6px 0;height:calc(56px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--rline)}
.rbar.bottom{bottom:0;padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rline)}
#reader.hidebars .rbar{visibility:hidden;transition:transform .2s,visibility 0s .2s}
#reader.hidebars .rbar.top{transform:translateY(-100%)}
#reader.hidebars .rbar.bottom{transform:translateY(100%)}
.rtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;padding:0 4px}
.rtitle b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle span{font-size:12px;color:var(--rmuted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rMark.on svg{fill:currentColor;color:var(--racc)}
#slider{width:100%;accent-color:var(--racc);margin:4px 0}
.brow{display:flex;align-items:center;justify-content:space-between}
#pageLabel{font-size:14px;color:var(--rmuted);text-align:center;flex:1}
#thin{position:absolute;left:0;bottom:0;height:3px;background:var(--racc);opacity:.7;z-index:2;transition:width .2s}
#reader:not(.hidebars) #thin{display:none}
.selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:16px;background:#1b2420;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.selbar button{min-height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;padding:0 12px;font-weight:600;font-size:14px}
.selbar .dot{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.7)}

/* painel */
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs button{flex:1;min-height:40px;border-radius:10px;border:0;background:var(--chip);font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.plist{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.li{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-size:15px;font-weight:600}
.li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.li q{display:block;font-family:var(--serif);font-size:14px;color:var(--ink);margin:3px 0;quotes:none}
.li .note{display:block;font-size:14px;color:var(--ink)}
.li .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.li .ibtn{width:36px;height:36px}
.srch{display:flex;gap:8px;margin-bottom:8px}
.srch input{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.li q em{display:inline;font-style:normal;font-weight:700;background:rgba(253,224,71,.5);color:inherit}
.hint{color:var(--muted);font-size:14px;padding:14px 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.setrow{margin-top:16px}
.setrow>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:80;max-width:min(92vw,420px);padding:10px 16px;border-radius:10px;background:#1b2420;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="lib">
  <header class="lhead">
    <h1>MyBook</h1>
    <button class="btn primary sm" id="addBtn" type="button"><i data-ic="plus"></i>Adicionar</button>
    <button class="ibtn" id="menuBtn" type="button" aria-label="Mais opções"><i data-ic="more"></i></button>
  </header>
  <div class="lsearch"><input id="q" type="search" placeholder="Buscar por título ou autor" aria-label="Buscar livros" autocomplete="off"></div>
  <nav class="chips" id="chips" aria-label="Filtros"></nav>
  <section id="resume" class="resume" hidden></section>
  <div class="ltool">
    <span id="count"></span>
    <label>Ordenar
      <select id="sort" aria-label="Ordenar livros">
        <option value="recent">Lidos recentemente</option>
        <option value="added">Adicionados</option>
        <option value="title">Título</option>
        <option value="author">Autor</option>
        <option value="progress">Progresso</option>
      </select>
    </label>
  </div>
  <main id="grid" class="grid"></main>
  <section id="empty" class="empty" hidden>
    <h2>Sua biblioteca está vazia</h2>
    <p>Adicione livros em EPUB ou PDF. Eles ficam guardados neste aparelho, e você continua de onde parou.</p>
    <button class="btn primary" id="addBtn2" type="button">Adicionar livros</button>
  </section>
</div>
<input type="file" id="file" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden>

<div id="reader" data-theme="claro" hidden>
  <div id="area">
    <div id="epubArea"></div>
    <div id="pdfArea" hidden><canvas id="pdfCanvas"></canvas></div>
    <div class="rloading" id="rloading" hidden>Abrindo o livro…</div>
  </div>
  <div id="thin" style="width:0"></div>
  <div class="rbar top" id="rTop">
    <button class="ibtn" id="rBack" type="button" aria-label="Voltar à biblioteca"><i data-ic="back"></i></button>
    <div class="rtitle"><b id="rTitle"></b><span id="rChap"></span></div>
    <button class="ibtn" id="rMark" type="button" aria-label="Marcar esta página"><i data-ic="bookmark"></i></button>
    <button class="ibtn" id="rPanel" type="button" aria-label="Sumário, marcadores e busca"><i data-ic="list"></i></button>
    <button class="ibtn" id="rAa" type="button" aria-label="Aparência"><i data-ic="type"></i></button>
  </div>
  <div class="rbar bottom" id="rBottom">
    <input type="range" id="slider" min="0" max="100" value="0" step="1" aria-label="Posição no livro">
    <div class="brow">
      <button class="ibtn" id="rPrev" type="button" aria-label="Página anterior"><i data-ic="prev"></i></button>
      <span id="pageLabel"></span>
      <button class="ibtn" id="rNext" type="button" aria-label="Próxima página"><i data-ic="next"></i></button>
    </div>
  </div>
  <div class="selbar" id="selbar" hidden>
    <button class="dot" data-c="#fde047" style="background:#fde047" aria-label="Marcar em amarelo"></button>
    <button class="dot" data-c="#86efac" style="background:#86efac" aria-label="Marcar em verde"></button>
    <button class="dot" data-c="#f9a8d4" style="background:#f9a8d4" aria-label="Marcar em rosa"></button>
    <button data-c="note">Nota</button>
    <button data-c="copy">Copiar</button>
  </div>
</div>

<div class="modal" id="bookSheet" hidden><div class="sheet" id="bookBox"></div></div>
<div class="modal" id="menuSheet" hidden>
  <div class="sheet">
    <h2>Biblioteca</h2>
    <div class="menu">
      <button class="btn" id="mShelves" type="button">Gerenciar estantes</button>
      <button class="btn" id="mStorage" type="button">Espaço usado pelos livros</button>
      <button class="btn" id="mClose" type="button">Fechar</button>
    </div>
  </div>
</div>
<div class="modal" id="shelvesSheet" hidden><div class="sheet" id="shelvesBox"></div></div>
<div class="modal" id="setSheet" hidden><div class="sheet" id="setBox"></div></div>
<div class="modal" id="panelSheet" hidden>
  <div class="sheet tall">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="toc" aria-selected="true">Sumário</button>
      <button role="tab" data-tab="marks" aria-selected="false">Marcadores</button>
      <button role="tab" data-tab="search" aria-selected="false">Buscar</button>
    </div>
    <div class="plist" id="panelBody"></div>
    <div class="row"><button class="btn" id="panelClose" type="button">Fechar</button></div>
  </div>
</div>
<div class="modal" id="dlg" hidden><div class="sheet" id="dlgBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

var ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>', more:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  back:'<path d="M15 18l-6-6 6-6"/>', prev:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  type:'<path d="M4 7V5h16v2M12 5v14M9 19h6"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  hl:'<path d="M4 20h6M14 4l6 6-9 9-6-6z"/>', note:'<path d="M5 4h14v12H9l-4 4z"/>'
};
function ic(n){ return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>'; }
function fillIcons(root){ Array.prototype.forEach.call((root || document).querySelectorAll('i[data-ic]'), function(el){ el.outerHTML = ic(el.dataset.ic); }); }

var toastT = null;
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 3800); }

/* ================= banco de dados (IndexedDB) ================= */
var DB = {
  db:null,
  open:function(){
    var self = this;
    return new Promise(function(res, rej){
      var r = indexedDB.open('biblioteca', 1);
      r.onupgradeneeded = function(){
        var d = r.result;
        d.createObjectStore('books', { keyPath:'id' });
        d.createObjectStore('files', { keyPath:'id' });
        d.createObjectStore('shelves', { keyPath:'id' });
        d.createObjectStore('notes', { keyPath:'id' }).createIndex('bookId', 'bookId');
      };
      r.onsuccess = function(){ self.db = r.result; res(); };
      r.onerror = function(){ rej(r.error); };
    });
  },
  tx:function(store, mode, fn){
    var self = this;
    return new Promise(function(res, rej){
      var t = self.db.transaction(store, mode), out, rq = fn(t.objectStore(store));
      if (rq) rq.onsuccess = function(){ out = rq.result; };
      t.oncomplete = function(){ res(out); };
      t.onerror = function(){ rej(t.error); };
      t.onabort = function(){ rej(t.error); };
    });
  },
  get:function(st, k){ return this.tx(st, 'readonly', function(s){ return s.get(k); }); },
  all:function(st){ return this.tx(st, 'readonly', function(s){ return s.getAll(); }); },
  put:function(st, v){ return this.tx(st, 'readwrite', function(s){ return s.put(v); }); },
  del:function(st, k){ return this.tx(st, 'readwrite', function(s){ return s.delete(k); }); },

function hue(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function coverHTML(b){
  if (b.cover) return '<img src="' + b.cover + '" alt="">';
  var h = hue(b.title || 'x');
  return '<div class="gen" style="background:linear-gradient(160deg,hsl(' + h + ' 34% 30%),hsl(' + ((h + 28) % 360) + ' 38% 19%))"><b>' + esc(b.title) + '</b><span>' + esc(b.author || '') + '</span></div>';
}
function visibleBooks(){
  var l = S.books.slice(), f = S.filter;
  if (f === 'reading') l = l.filter(function(b){ return b.progress > 0 && !isDone(b); });
  else if (f === 'new') l = l.filter(function(b){ return !(b.progress > 0) && !b.done; });
  else if (f === 'done') l = l.filter(isDone);
  else if (f === 'fav') l = l.filter(function(b){ return b.fav; });
  else if (f.indexOf('shelf:') === 0){ var sid = f.slice(6); l = l.filter(function(b){ return (b.shelves || []).indexOf(sid) >= 0; }); }
  var q = S.q.trim().toLowerCase();
  if (q) l = l.filter(function(b){ return (b.title + ' ' + (b.author || '')).toLowerCase().indexOf(q) >= 0; });
  var cmp = {
    recent:function(a, b){ return (b.openedAt || 0) - (a.openedAt || 0) || b.addedAt - a.addedAt; },
    added:function(a, b){ return b.addedAt - a.addedAt; },
    title:function(a, b){ return a.title.localeCompare(b.title, 'pt-BR'); },
    author:function(a, b){ return (a.author || '').localeCompare(b.author || '', 'pt-BR') || a.title.localeCompare(b.title, 'pt-BR'); },
    progress:function(a, b){ return (b.progress || 0) - (a.progress || 0); }
  }[S.sort];
  return l.sort(cmp);
}
function countFor(f){
  var save = S.filter; S.filter = f; var q = S.q; S.q = ''; var n = visibleBooks().length; S.filter = save; S.q = q; return n;
}

/* ================= importar livros ================= */
function shrink(blob){
  return createImageBitmap(blob).then(function(bmp){
    var w = 260, h = Math.round(bmp.height * (w / bmp.width));
    if (h > 400){ h = 400; w = Math.round(bmp.width * (h / bmp.height)); }
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.82);
  });
}
function cleanName(n){ return n.replace(/\.(epub|pdf)$/i, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim(); }
async function extractEpub(file){
  var buf = await file.arrayBuffer(), book = ePub(), cover = null, title = '', author = '';
  await book.open(buf, 'binary'); await book.ready;
  try { var m = await book.loaded.metadata; title = (m.title || '').trim(); author = (m.creator || '').trim(); } catch(e){}
  try { var url = await book.coverUrl(); if (url){ cover = await shrink(await (await fetch(url)).blob()); } } catch(e){}
  try { book.destroy(); } catch(e){}
  return { title:title, author:author, cover:cover };
}
async function extractPdf(file){
  var buf = new Uint8Array(await file.arrayBuffer());
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  var pdf = await pdfjsLib.getDocument({ data:buf, isEvalSupported:false }).promise, title = '', author = '', cover = null;
  try { var md = await pdf.getMetadata(); title = ((md.info && md.info.Title) || '').trim(); author = ((md.info && md.info.Author) || '').trim(); } catch(e){}
  try {
    var pg = await pdf.getPage(1), v1 = pg.getViewport({ scale:1 }), sc = 260 / v1.width, vp = pg.getViewport({ scale:sc });
    var c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await pg.render({ canvasContext:c.getContext('2d'), viewport:vp }).promise;
    cover = c.toDataURL('image/jpeg', 0.82);
  } catch(e){}
  var pages = pdf.numPages; try { pdf.destroy(); } catch(e){}
  if (/^(untitled|sem t[ií]tulo)/i.test(title)) title = '';
  return { title:title, author:author, cover:cover, pages:pages };
}
var importing = false;
async function importFiles(files){
  if (importing) return;
  var list = files.filter(function(f){ return /\.(epub|pdf)$/i.test(f.name) || /epub|pdf/i.test(f.type); });
  if (!list.length){ toast('Escolha arquivos EPUB ou PDF.'); return; }
  importing = true;
  var ok = 0, dup = 0, fail = 0;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  for (var i = 0; i < list.length; i++){
    var f = list[i];
    toast('Adicionando ' + (i + 1) + ' de ' + list.length + '…');
    try {
      var type = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name) ? 'pdf' : 'epub';
      if (S.books.some(function(b){ return b.size === f.size && b.fileName === f.name; })){ dup++; continue; }
      var m = type === 'pdf' ? await extractPdf(f) : await extractEpub(f);
      var id = uid();
      var meta = { id:id, type:type, title:m.title || cleanName(f.name) || 'Sem título', author:m.author || '', cover:m.cover || null, pages:m.pages || 0,
        size:f.size, fileName:f.name, addedAt:Date.now(), openedAt:0, progress:0, pos:null, locations:null, shelves:[], fav:false, done:false };
      await DB.put('files', { id:id, blob:f });
      await DB.put('books', meta);
      S.books.push(meta); ok++;
    } catch(e){ console.error(e); fail++; }
  }
  importing = false;
  renderLib();
  var msg = ok + (ok === 1 ? ' livro adicionado' : ' livros adicionados');
  if (dup) msg += ', ' + dup + ' já estava' + (dup === 1 ? '' : 'm') + ' na biblioteca';
  if (fail) msg += ', ' + fail + ' não pôde' + (fail === 1 ? '' : 'ram') + ' ser aberto' + (fail === 1 ? '' : 's');
  toast(msg + '.');
}

async function openBook(id){
  var meta = bookById(id); if (!meta) return;
  var rec = await DB.get('files', id);
  if (!rec){ toast('O arquivo deste livro não foi encontrado.'); return; }
  $('#bookSheet').hidden = true;
  S.libScroll = window.scrollY;
  R = { id:id, meta:meta, type:meta.type, notes:await DB.notesOf(id), themeN:0, pct:meta.progress || 0, locReady:false, flow:cfg.flow, toc:[], saveT:null, pdfText:{}, srchTok:0 };
  document.body.classList.add('reading');
  $('#lib').hidden = true;
  var rd = $('#reader'); rd.hidden = false; rd.classList.remove('hidebars');
  $('#rTitle').textContent = meta.title; $('#rChap').textContent = '';
  $('#epubArea').hidden = meta.type !== 'epub'; $('#pdfArea').hidden = meta.type !== 'pdf';
  $('#pageLabel').textContent = ''; $('#slider').value = 0; $('#slider').disabled = true;
  applyReaderTheme();
  $('#rloading').hidden = false;
  history.pushState({ reader:1 }, '');
  try {
    if (meta.type === 'epub') await openEpub(rec.blob); else await openPdf(rec.blob);
  } catch(e){ console.error(e); toast('Não foi possível abrir este livro.'); teardown(); return; }
  $('#rloading').hidden = true;
  meta.openedAt = Date.now(); DB.put('books', meta);
  setTimeout(function(){ if (R && R.id === id) $('#reader').classList.add('hidebars'); }, 2600);
}
function closeReader(){

}
function teardown(){
  if (!R) return;

  return out;
}
async function openEpub(blob){

    'body *':{ 'color':t.fg + ' !important' },

/* ================= PDF ================= */
async function openPdf(blob){

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  R.pdf = await pdfjsLib.getDocument({ data:buf, isEvalSupported:false }).promise;
  R.total = R.pdf.numPages; R.page = clamp(parseInt(R.meta.pos, 10) || 1, 1, R.total);
  var sc = $('#pdfArea');
  sc.onclick = onPdfTap;
  sc.onpointerdown = function(e){ if (R){ R.pd = { x:e.clientX, y:e.clientY }; R.swiped = false; } };
  sc.onpointerup = function(e){
    if (!R || !R.pd) return;
    var dx = e.clientX - R.pd.x, dy = e.clientY - R.pd.y; R.pd = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && canSwipe()){ R.swiped = true; if (dx < 0) goNext(); else goPrev(); }
  };

  await goPdf(R.page, true);
}
function canSwipe(){ var a = $('#pdfArea'); return a.scrollWidth <= a.clientWidth + 2; }

}
async function goPdf(n, first){

  R.page = n;
  await renderPdf();
  R.pct = R.total > 1 ? (n - 1) / (R.total - 1) : 1; if (n === R.total) R.pct = 1;
  queueSave({ pos:n, progress:R.pct });

}
async function renderPdf(){
  if (!R || !R.pdf) return;
  var token = (R.rtoken = (R.rtoken || 0) + 1);
  if (R.task){ try { R.task.cancel(); } catch(e){} }
  var page = await R.pdf.getPage(R.page);
  if (!R || token !== R.rtoken) return;
  var area = $('#pdfArea'), cw = area.clientWidth, ch = area.clientHeight, base = page.getViewport({ scale:1 });
  var fit = cfg.fit === 'page' ? Math.min(cw / base.width, ch / base.height) : cw / base.width;
  var scale = fit * cfg.zoom, dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  var cv = $('#pdfCanvas');

async function pdfOutline(){

    (function walk(items, level){ (items || []).forEach(function(it){ out.push({ label:(it.title || '').trim(), dest:it.dest, level:level }); walk(it.items, level + 1); }); })(ol, 0);

/* ================= painel: sumário, marcadores e busca ================= */

}

async function runSearch(q){

        if (txt == null){
          var pg = await R.pdf.getPage(p), tc = await pg.getTextContent();
          txt = R.pdfText[p] = tc.items.map(function(i){ return i.str; }).join(' ').replace(/\s+/g, ' ');
        }
        var low = txt.toLowerCase(), at = low.indexOf(ql);
        while (at >= 0 && found.length < MAX){
          var s = Math.max(0, at - 40), e2 = Math.min(txt.length, at + q.length + 60);
          found.push({ page:p, where:'Página ' + p, html:esc(txt.slice(s, at)) + '<em>' + esc(txt.slice(at, at + q.length)) + '</em>' + esc(txt.slice(at + q.length, e2)) });
          at = low.indexOf(ql, at + q.length);
        }
        if (p % 5 === 0){ show(false); await sleep(0); }
      }
    } else {
      var items = R.book.spine.spineItems;
      for (var i = 0; i < items.length && found.length < MAX; i++){
        if (tok !== R.srchTok) return;
        var it = items[i];
        try {
          await it.load(R.book.load.bind(R.book));
          var hits = it.find(q) || [];
          hits.forEach(function(h){
            if (found.length >= MAX) return;
            var ex = h.excerpt || '', k = ex.toLowerCase().indexOf(q.toLowerCase());
            var html = k >= 0 ? esc(ex.slice(0, k)) + '<em>' + esc(ex.slice(k, k + q.length)) + '</em>' + esc(ex.slice(k + q.length)) : esc(ex);
            var where = 'Capítulo ' + (i + 1);
            try { if (R.locReady){ var li = R.book.locations.locationFromCfi(h.cfi); if (typeof li === 'number' && li >= 0) where = 'Página ' + (li + 1); } } catch(x){}
            found.push({ cfi:h.cfi, where:where, html:html });
          });
          it.unload();
        } catch(x){}
        if (i % 3 === 2){ show(false); await sleep(0); }
      }
    }
    show(true);
  } catch(e){ console.error(e); res.innerHTML = '<p class="hint">A busca falhou neste livro.</p>'; }
}

/* ================= aparência ================= */
function seg(name, opts, cur){
  return '<div class="seg">' + opts.map(function(o){ return '<button type="button" data-set="' + name + '" data-v="' + o[0] + '" aria-pressed="' + (String(cur) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>';
}
function renderSettings(){
  var h = '<h2>Aparência</h2>' +
    '<div class="setrow"><span>Tema</span>' + seg('theme', [['auto', 'Automático'], ['claro', 'Claro'], ['sepia', 'Sépia'], ['escuro', 'Escuro']], cfg.theme) + '</div>';
  if (R && R.type === 'epub'){
    h += '<div class="setrow"><span>Letra</span>' + seg('font', [['serif', 'Com serifa'], ['sans', 'Sem serifa']], cfg.font) + '</div>' +
      '<div class="setrow"><span>Tamanho do texto</span><div class="seg"><button type="button" data-step="-10" aria-label="Diminuir o texto">A−</button><button type="button" disabled style="min-width:72px">' + cfg.size + '%</button><button type="button" data-step="10" aria-label="Aumentar o texto">A+</button></div></div>' +
      '<div class="setrow"><span>Espaço entre linhas</span>' + seg('lh', [['1.35', 'Compacto'], ['1.55', 'Normal'], ['1.8', 'Amplo']], cfg.lh) + '</div>' +
      '<div class="setrow"><span>Modo de leitura</span>' + seg('flow', [['paginated', 'Virar páginas'], ['scrolled', 'Rolagem']], cfg.flow) + '</div>';
  } else if (R){
    h += '<div class="setrow"><span>Ajuste da página</span>' + seg('fit', [['width', 'Largura'], ['page', 'Página inteira']], cfg.fit) + '</div>' +
      '<div class="setrow"><span>Zoom</span>' + seg('zoom', [['1', '100%'], ['1.25', '125%'], ['1.5', '150%'], ['2', '200%']], cfg.zoom) + '</div>';
  }
  h += '<div class="row"><button class="btn primary" id="setClose" type="button">Pronto</button></div>';
  $('#setBox').innerHTML = h;
}
$('#rAa').addEventListener('click', function(){ renderSettings(); $('#setSheet').hidden = false; });
$('#setBox').addEventListener('click', function(e){
  if (e.target.closest('#setClose')){ $('#setSheet').hidden = true; return; }
  var st = e.target.closest('[data-step]'), sb = e.target.closest('[data-set]');
  if (st){ cfg.size = clamp(cfg.size + parseInt(st.dataset.step, 10), 70, 240); }
  else if (sb){
    var k = sb.dataset.set, v = sb.dataset.v;
    cfg[k] = (k === 'lh' || k === 'zoom') ? parseFloat(v) : v;
  } else return;
  saveCfg(); applyReaderTheme(); renderSettings();
  if (!R) return;
  if (R.type === 'epub'){
    if (cfg.flow !== R.flow){ var id = R.id; $('#setSheet').hidden = true; flushSave(); var meta = R.meta; try { R.rendition.destroy(); } catch(x){} try { R.book.destroy(); } catch(x){} $('#epubArea').innerHTML = ''; reopenEpub(); }
    else applyEpubTheme();
  } else { R.rendered = false; renderPdf(); }
});
async function reopenEpub(){
  var rec = await DB.get('files', R.id);
  $('#rloading').hidden = false; R.locReady = false; R.loc = null; R.toc = [];
  try { await openEpub(rec.blob); } catch(e){ console.error(e); toast('Não foi possível trocar o modo de leitura.'); }
  $('#rloading').hidden = true;
}
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (R){ applyReaderTheme(); if (R.type === 'epub') applyEpubTheme(); } });
window.addEventListener('resize', function(){ if (R && R.type === 'pdf'){ clearTimeout(R.rzT); R.rzT = setTimeout(function(){ R.rendered = false; renderPdf(); }, 200); } });

/* ================= janelas: fechar ================= */
$$('.modal').forEach(function(m){ m.addEventListener('click', function(e){ if (e.target === m && m.id !== 'dlg') m.hidden = true; }); });
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var open = $$('.modal').filter(function(m){ return !m.hidden; }).pop();
  if (open){ if (open.id === 'dlg'){ var c = open.querySelector('[data-a="cancel"]'); if (c) c.click(); } else open.hidden = true; }
});

/* ================= início ================= */
async function init(){
  fillIcons();
  try {
    await DB.open();
    S.books = await DB.all('books'); S.shelves = await DB.all('shelves');
  } catch(e){ console.error(e); toast('Não foi possível abrir o armazenamento do navegador.'); }
  renderLib();

  /* arquivos recebidos pelo Android (Abrir com / Compartilhar) */
  try {
    if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()){
      var Incoming = Capacitor.registerPlugin('Incoming');
      Incoming.addListener('incoming', async function(d){
        try {
          var res = await fetch(Capacitor.convertFileSrc('file://' + d.path)), blob = await res.blob();
          var f = new File([blob], d.name, { type:d.mime || blob.type });
          if (R) teardown();
          await importFiles([f]);
          var b = S.books.find(function(x){ return x.fileName === f.name && x.size === f.size; });
          if (b) openBook(b.id);
        } catch(e){ console.error(e); toast('Não foi possível abrir o arquivo recebido.'); }
      });
    }
  } catch(e){ console.error(e); }
  var m = /[?&]shared=(\d+)/.exec(location.search);
  if (m && window.caches){
    try {
      var c = await caches.open('shared-books'), files = [];
      for (var i = 0; i < parseInt(m[1], 10); i++){
        var key = new URL('shared-' + i, location.href).href, r = await c.match(key);
        if (r){ var blob = await r.blob(); files.push(new File([blob], decodeURIComponent(r.headers.get('X-Filename') || ('livro' + i)), { type:blob.type })); await c.delete(key); }
      }
      history.replaceState(null, '', location.pathname);
      if (files.length) importFiles(files);
    } catch(e){ console.error(e); }
  }
}
init();
})();
</script>
